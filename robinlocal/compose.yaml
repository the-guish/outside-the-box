# Robinauts from the zip of a branch, in its local development mode, answering with
# claude-everywhere. start.sh is the way in; see README.md.
name: robinlocal

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: robinauts
      POSTGRES_PASSWORD: robinauts
      POSTGRES_DB: robinauts
    ports:
      - "127.0.0.1:${ROBINLOCAL_PG_PORT:-54396}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "robinauts"]
      interval: 2s
      retries: 30

  # A local MCP server: reads a web page as text. On a network of its own, apart from the database.
  fetch:
    build: ./fetch
    ports:
      - "127.0.0.1:${ROBINLOCAL_FETCH_PORT:-8942}:8932"
    networks: [web]
    mem_limit: 512m
    pids_limit: 256
    cap_drop: [ALL]

  robinauts:
    build: .
    image: robinlocal
    # Sign-in off binds loopback only, so the server shares the host's network. It then
    # reaches the database and claude-everywhere on 127.0.0.1, like openworker does.
    network_mode: host
    init: true
    depends_on:
      db:
        condition: service_healthy
    command: ["/scripts/entry.sh", "serve"]
    environment:
      ROBINLOCAL_ZIP_URL: ${ROBINLOCAL_ZIP_URL:-https://github.com/the-guish/robinauts/archive/refs/heads/main.zip}
      ROBINLOCAL_PORT: ${ROBINLOCAL_PORT:-8010}
      ROBINLOCAL_CLAUDE_URL: http://127.0.0.1:${CLAUDE_EVERYWHERE_PORT:-8787}
      ROBINLOCAL_CLOUD: ${ROBINLOCAL_CLOUD:-1}
      ROBINLOCAL_CLOUD_URL: ${ROBINLOCAL_CLOUD_URL:-}
      ROBINLOCAL_FETCH_PORT: ${ROBINLOCAL_FETCH_PORT:-8942}
      ROBINLOCAL_TODO_PORT: ${ROBINLOCAL_TODO_PORT:-8946}
      ROBINLOCAL_DIAGRAMS_PORT: ${ROBINLOCAL_DIAGRAMS_PORT:-8947}
      ROBINAUTS_DATABASE_URL: postgresql://robinauts:robinauts@127.0.0.1:${ROBINLOCAL_PG_PORT:-54396}/robinauts
      # claude-everywhere takes any key unless CLAUDE_EVERYWHERE_API_KEY is set.
      ROBINLOCAL_CLAUDE_KEY: ${CLAUDE_EVERYWHERE_API_KEY:-unused}
    volumes:
      - ./container:/scripts:ro
      - work:/work
      - config:/config
      - venv:/venv
      - cache:/cache

networks:
  web: {}

volumes:
  pgdata:
  # The unzipped source, its node_modules and built interface, and the to-do list.
  work:
  # robinauts.toml alone: the Claude Code worker mounts this volume, and nothing else of ours.
  config:
  venv:
  # uv's and npm's caches, and uv's Python.
  cache:
