[project]
name = "claude-everywhere"
version = "0.1.0"
description = "OpenAI and Anthropic APIs backed by the claude CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
claude-everywhere = "claude_everywhere.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "openai>=1.50",
    "httpx>=0.27",
    "anthropic>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_claude: runs the real claude CLI (set RUN_REAL_CLAUDE=1)"]
